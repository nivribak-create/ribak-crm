<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ribak CRM</title>
  <meta name="description" content="ניהול לידים ואנליטיקת המרה – מליד חדש ועד סגירת מנוי">
  <meta name="theme-color" content="#0F7A84">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ribak CRM">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Karantina:wght@700&display=swap">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try { const t = localStorage.getItem('ribak:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/dashboard" aria-label="Ribak CRM">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="5" width="26" height="5" rx="2.5"/>
          <rect x="7" y="13.5" width="18" height="5" rx="2.5" opacity=".78"/>
          <rect x="11" y="22" width="10" height="5" rx="2.5" opacity=".55"/>
        </svg>
        <span class="brand__name">Ribak <span>CRM</span></span>
      </a>
      <nav class="nav" id="nav" aria-label="ניווט ראשי">
        <a href="#/dashboard" data-view="dashboard">לוח בקרה</a>
        <a href="#/pipeline" data-view="pipeline">פייפליין <span class="badge" id="badge" hidden></span></a>
        <a href="#/leads" data-view="leads">לידים</a>
      </nav>
      <div class="topbar__actions">
        <button class="icon-btn" data-global="theme" title="מצב כהה / בהיר" aria-label="החלפת ערכת צבע">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
        <button class="icon-btn" data-global="data" title="גיבוי, ייבוא ונתוני דוגמה" aria-label="נתונים">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        </button>
        <button class="icon-btn" id="logout" data-global="logout" title="יציאה מהמערכת" aria-label="יציאה" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 4v16"/></svg>
        </button>
        <button class="btn btn--primary" data-global="add">+ ליד חדש</button>
      </div>
    </div>
  </header>

  <div class="mode-note" id="mode" hidden>מצב מקומי – הלידים נשמרים בדפדפן הזה בלבד</div>

  <div class="sample-banner" id="sample-banner" hidden>
    <span>אלה נתוני דוגמה, כדי שתראה איך המערכת נראית מלאה.</span>
    <button class="btn btn--sm" data-global="start-clean">מחק והתחל עם לידים אמיתיים</button>
  </div>

  <main id="view" class="view"></main>

  <noscript><div class="empty">המערכת צריכה JavaScript כדי לעבוד.</div></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
